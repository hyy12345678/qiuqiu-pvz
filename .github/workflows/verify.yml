# E11：把 CI 改成「直接跑 npm run verify」，而不是手抄一份步骤序列。
#
# 起因很具体：E9 往 verify 里加了 test:inventory，而这里的步骤是手写的，
# 于是立刻脱节——CI 不会跑那条检查。手写一份永不漂移的副本是不存在的，
# 所以这里只保留一条与本地完全相同的命令，漂移从结构上被消除。
#
# 只有两件事是 CI 独有的，因此单独成步：
#   1. dist:fresh —— 要求 dist 已随源码提交。放进本地 verify 会逼着人先提交再验收。
#   2. 失败时上传 Playwright 现场。

name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # parity:legacy 需要 pre-refactor-baseline 这个 tag（它不在 verify 链里，但保留检出深度
      # 可以让将来的考古工作不必重新 clone）。
      - name: 检出（保留 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22（engines 要求 >=20；20/22 均为本项目实测版本）
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖（严格按 package-lock.json）
        run: npm ci

      # 浏览器版本由 lock 里的 Playwright 决定，避免「本地绿、CI 红」的假失败。
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # 与本地验收完全同一条命令：parity → fingerprint → test → test:inventory
      # → parity:dist（build 之前）→ build → test:smoke → test:browser。
      # 不要在这里拆步骤——拆了就会漂移，E9 已经发生过一次。
      - name: 全链护栏（等于本地的 npm run verify）
        run: npm run verify

      # 仅 CI：verify 末段会重新构建 dist，这一步确认构建结果与提交的一致。
      - name: 产物必须已提交
        run: npm run dist:fresh

      - name: 上传现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
