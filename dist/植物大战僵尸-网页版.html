  // src/core/entities.js
  function cellCX(c) {
    return LX + c * CW + CW / 2;
  }
  function cellFY(r) {
    return LY + (r + 1) * CH - 6;
  }
  function placePlant(world, type, row, col) {
    const def = PLANTS[type];
    world.sun -= def.cost;
    const p = {
      type,
      row,
      col,
      hp: def.hp,
      maxHp: def.hp,
      phase: rand(world.fxRng, 0, TAU),
      cx: cellCX(col),
      fy: cellFY(row),
      fireT: rand(world.rng, 0.5, 1.3),
      sunT: rand(world.rng, 6, 9),
      recoil: 0,
      flash: 0,
      armed: false,
      armT: 0,
      fuse: type === "cherry" ? 1.05 : 0,
      lifeT: def.life || 0,
      maxLifeT: def.life || 0,
      // 限时登场的角色靠它倒计时；其余植物为 0，不参与
      asleep: !!def.mushroom && !isNight(world)
      // 蘑菇白天种下先打盹，等咖啡豆唤醒
    };
    world.grid[row][col] = p;
    world.plants.push(p);
    world.ports.sound("plant");
    addDirtPuff(world, p.cx, p.fy);
  }
  function applyCoffee(world, p) {
    if (!p || !p.asleep) return false;
    p.asleep = false;
    world.ports.sound("select");
    return true;
  }
  function removePlant(world, p) {
    world.grid[p.row][p.col] = null;
    const i = world.plants.indexOf(p);
    if (i >= 0) world.plants.splice(i, 1);
  }
  function spawnSun(world, x, y, ty, fromSky, value) {
    world.suns.push({ x, y, ty, value: value || 50, life: 10, state: "fall", t: 0, fromSky, sx: x, ft: 0 });
  }
  function explode(world, x, row, big) {
    world.visual.shake = Math.max(world.visual.shake, big ? 0.55 : 0.4);
    world.visual.flash = big ? 0.3 : 0.2;
    world.ports.sound("boom");
    world.visual.decals.push({ x, fy: LY + row * CH + CH / 2, ttl: 6, max: 6, r: big ? 95 : 55 });
    for (let i = 0; i < 46; i++) {
      const a = rand(world.fxRng, 0, TAU), sp = rand(world.fxRng, 40, big ? 340 : 210);
      world.visual.parts.push({
        x,
        y: LY + row * CH + CH / 2,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 70,
        g: 230,
        life: rand(world.fxRng, 0.3, 0.85),
        max: 0.85,
        size: rand(world.fxRng, 3, 10),
        color: ["#fff3b0", "#ffdf6e", "#ff9a2e", "#ff5a2e", "#9a9a92"][randi(world.fxRng, 0, 4)]
      });
    }
    for (let k = 0; k < 6; k++) {
      world.visual.parts.push({
        x: x + rand(world.fxRng, -20, 20),
        y: LY + row * CH + CH / 2,
        vx: rand(world.fxRng, -15, 15),
        vy: rand(world.fxRng, -70, -35),
        g: -30,
        life: rand(world.fxRng, 0.7, 1.2),
        max: 1.2,
        size: rand(world.fxRng, 9, 16),
        color: "rgba(90,85,80,0.5)"
      });
    }
    for (const z of world.zombies) {
      if (z.state === "dying") continue;
      if (Math.abs(z.row - row) <= (big ? 1 : 0) && Math.abs(z.x - x) < (big ? 132 : 58)) {
        damageZombie(world, z, 1800);
      }
    }
  }
  function explodeMissile(world, x, row, col) {
    world.visual.shake = Math.max(world.visual.shake, 0.3);
    world.visual.flash = Math.max(world.visual.flash, 0.15);
    world.ports.sound("boom");
    world.visual.decals.push({ x, fy: LY + row * CH + CH / 2, ttl: 4, max: 4, r: 72 });
    for (let i = 0; i < 30; i++) {
      const a = rand(world.fxRng, 0, TAU), sp = rand(world.fxRng, 30, 240);
      world.visual.parts.push({
        x,
        y: LY + row * CH + CH / 2,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 50,
        g: 240,
        life: rand(world.fxRng, 0.25, 0.6),
        max: 0.6,
        size: rand(world.fxRng, 2, 6),
        color: ["#ffdf6e", "#ff9a2e", "#ff5a2e", "#9a9a92"][randi(world.fxRng, 0, 3)]
      });
    }
    const c = col !== void 0 ? col : Math.floor((x - LX) / CW);
    for (const z of world.zombies) {
      if (z.state === "dying") continue;
      const zc = Math.floor((z.x - LX) / CW);
      if (Math.abs(z.row - row) <= 1 && Math.abs(zc - c) <= 1) {
        damageZombie(world, z, 90);
      }
    }
  }
  function damageZombie(world, z, d) {
    if (z.acc > 0) {
      z.acc -= d;
      if (z.acc < 0) {
        z.hp += z.acc;
        z.acc = 0;
      }
    } else {
      z.hp -= d;
    }
    if (z.type === "newspaper" && !z.angry && z.acc <= 0 && z.state !== "dying") {
      z.angry = true;
      z.speed = 34 * rand(world.rng, 0.94, 1.08);
      z.slowT = 0;
      addPaperShreds(world, z.x, LY + (z.row + 1) * CH - 76);
      world.ports.sound("paperTear");
      world.ports.sound("angry");
    }
    if (z.hp <= 0 && z.state !== "dying") {
      z.state = "dying";
      z.deathT = 0;
      world.killed++;
      world.ports.sound("groan");
    }
  }
  function spawnZombie(world, type) {
    const def = ZTYPES[type];
    let row = randi(world.rng, 0, ROWS - 1);
    if (world.lastRows.length >= 2 && world.lastRows[0] === row && world.lastRows[1] === row) {
      row = (row + randi(world.rng, 1, ROWS - 1)) % ROWS;
    }
    world.lastRows.unshift(row);
    if (world.lastRows.length > 3) world.lastRows.length = 3;
    world.zombies.push({
      type,
      row,
      x: W + 40 + rand(world.rng, 0, 40),
      speed: def.speed * rand(world.rng, 0.92, 1.08),
      hp: def.hp,
      acc: def.acc,
      maxHp: def.hp + def.acc,
      state: "walk",
      animT: rand(world.fxRng, 0, TAU),
      eatT: 0,
      slowT: 0,
      poleLost: false,
      vt: 0,
      fromX: 0,
      toX: 0,
      vy: 0,
      deathT: 0,
      eatPlant: null,
      dustT: 0,

  // src/render/scenes/play.js
  function renderPlay(t, world, ui, musicOn) {
    drawBackground(world, t);
    for (const d of world.visual.decals) {
      ctx.save();
      ctx.globalAlpha = clamp(d.ttl / d.max, 0, 1) * 0.55;
      let g = ctx.createRadialGradient(d.x, d.fy, 4, d.x, d.fy, d.r);
      g.addColorStop(0, "rgba(40,28,12,0.9)");
      g.addColorStop(1, "rgba(40,28,12,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(d.x, d.fy, d.r, d.r * 0.5, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    for (const m of world.mowers) drawMower(t, m);
    const hc = ui.hoverCell;
    if (hc && world.state === "play" && !world.paused) {
      const x = LX + hc.col * CW, y = LY + hc.row * CH;
      if (ui.shovel) {
        ctx.fillStyle = "rgba(220,90,45,0.3)";
        ctx.fillRect(x, y, CW, CH);
        ctx.strokeStyle = "rgba(220,90,45,0.85)";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x + 2, y + 2, CW - 4, CH - 4);
      } else if (ui.sel >= 0) {
        const selType = world.slots[ui.sel].type;
        const isCoffee = selType === "coffee";
        const ok = inspectUseCard(world, ui.sel, hc.row, hc.col).ok;
        ctx.fillStyle = ok ? "rgba(255,255,220,0.32)" : "rgba(200,40,30,0.32)";
        ctx.fillRect(x, y, CW, CH);
        ctx.strokeStyle = ok ? "rgba(255,250,200,0.9)" : "rgba(230,60,40,0.9)";
        ctx.lineWidth = 2.5;
        const bl = 12, pu = Math.sin(t * 6) * 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 2 + bl + pu);
        ctx.lineTo(x + 2, y + 2);
        ctx.lineTo(x + 2 + bl + pu, y + 2);
        ctx.moveTo(x + CW - 2 - bl - pu, y + 2);
        ctx.lineTo(x + CW - 2, y + 2);
        ctx.lineTo(x + CW - 2, y + 2 + bl + pu);
        ctx.moveTo(x + CW - 2, y + CH - 2 - bl - pu);
        ctx.lineTo(x + CW - 2, y + CH - 2);
        ctx.lineTo(x + CW - 2 - bl - pu, y + CH - 2);
        ctx.moveTo(x + 2 + bl + pu, y + CH - 2);
        ctx.lineTo(x + 2, y + CH - 2);
        ctx.lineTo(x + 2, y + CH - 2 - bl - pu);
        ctx.stroke();
        if (ok && !isCoffee) {
          ctx.save();
          ctx.globalAlpha = 0.55;
          const ghost = {
            type: selType,
            cx: cellCX(hc.col),
            fy: cellFY(hc.row),
            phase: 0,
            armed: true,
            fuse: 0.9,
            hp: 1,
            maxHp: 1,
            recoil: 0,
            flash: 0,
            asleep: !!PLANTS[selType].mushroom && !isNight(world)
          };
          drawPlantEntity(t, ghost);
          ctx.restore();
        }
      }
    }
    const zombiesByRow = Array.from({ length: ROWS }, () => []);
    for (const z of world.zombies) zombiesByRow[z.row].push(z);
    for (const row of zombiesByRow) row.sort((a, b) => a.x - b.x);
    for (let r = 0; r < ROWS; r++) {
      for (const p of world.plants) if (p.row === r) drawPlantEntity(t, p);
      for (const z of zombiesByRow[r]) drawZombieEntity(t, z);
    }
    for (const p of world.peas) drawPea(p);
    for (const p of world.visual.parts) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

  // src/render/scenes/end.js

      g.addColorStop(1, "#2c1c26");

      else drawText("你通关了全部 " + LEVELS.length + " 个关卡，草坪安全了！", W / 2, py + 158, 17, "#a05c10", null, 0, "center", "700");
      const leftLabel = lastLv ? "再玩一次" : "下一关";

      drawButton(ui, W / 2 - 215, py + ph - 76, 200, 48, leftLabel, "next", leftAction, {});

    } else {

      drawText("消灭僵尸：" + world.killed + " / " + world.total, W / 2, py + 130, 19, "#d8b8c0", null, 0, "center", "700");
      drawButton(ui, W / 2 - 215, py + ph - 76, 200, 48, "重新挑战", "retry", { type: "level", index: world.level }, { red: true });

  // src/render/scenes/index.js
  function render(world, ui, frame) {
    clearHotspots(ui);
    ctx.save();
    try {
      if (world.visual.shake > 0 && world.state === "play") {
        ctx.translate(rand(frame.rng, -1, 1) * world.visual.shake * 14, rand(frame.rng, -1, 1) * world.visual.shake * 14);
      }
      if (world.state === "menu") renderMenu(frame.t, world, ui, frame.musicOn);
      else if (world.state === "help") renderHelp(frame.t, world, ui);
      else if (world.state === "select") renderSelect(frame.t, world, ui);
      else if (world.state === "quiz") renderQuiz(frame.t, world, ui);
      else {
        renderPlay(frame.t, world, ui, frame.musicOn);
        if (world.state === "won" || world.state === "lost") renderEndOverlay(frame.t, world, ui);
      }
    } finally {
      ctx.restore();
    }
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.55, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(10,20,8,0.22)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // src/core/sim.js
  function updatePlay(world, dt) {
    world.t += dt;
    if (world.visual.nightHint > 0) world.visual.nightHint -= dt;
    stepSpawns(world, dt);
    stepPlants(world, dt);
    stepProjectiles(world, dt);
    if (stepZombies(world, dt)) return;
    stepMowers(world, dt);
    stepSuns(world, dt);
    stepVisual(world, dt);
    stepProgress(world, dt);
  }
  function stepSpawns(world, dt) {
    const t = world.t;
    const lv = LEVELS[world.level];
    const v = world.visual;
    if (t > 0) {
      while (world.evIdx < world.events.length && world.events[world.evIdx].t <= t) {
        const e = world.events[world.evIdx++];
        if (e.announce) {
          v.waveText = { text: "一大波僵尸正在接近！", t: 0 };
          world.ports.sound("horn");
        } else spawnZombie(world, e.type);
      }
      if (!lv.night) {
        world.skyTimer -= dt;
        if (world.skyTimer <= 0) {
          world.skyTimer = rand(world.rng, 4.5, 6.5);
          spawnSun(world, rand(world.rng, LX + 30, LX + COLS * CW - 30), -30, rand(world.rng, LY + 60, LY + ROWS * CH - 40), true);
        }
      }
    }
  }
  function stepPlants(world, dt) {
    const t = world.t;
    const v = world.visual;
    for (let i = world.plants.length - 1; i >= 0; i--) {
      const p = world.plants[i];
      if (p.hp <= 0) {
        removePlant(world, p);
        addLeafBurst(world, p.cx, p.fy - 30);
        continue;
      }
      p.recoil = Math.max(0, p.recoil - dt * (p.type === "qiuqiu" ? 4 : 1.4));
      p.flash = Math.max(0, (p.flash || 0) - dt);
      if (p.asleep) continue;
      switch (p.type) {
        case "sunflower":
        case "sunshroom":
          if (t > 0) {
            p.sunT -= dt;
            if (p.sunT <= 0) {

              const small = p.type === "sunshroom";
              spawnSun(world, p.cx + rand(world.rng, -14, 14), p.fy - (small ? 46 : 88), p.fy - 30, false, small ? 25 : 50);
            }
          }
          break;
        case "puff":
        case "peashooter":
        case "snowpea":
        case "repeater":
        case "qiuqiu": {
          p.fireT -= dt;
          const reach = p.type === "puff" ? p.cx + CW * 2 : W + 50;
          let has = false;
          for (const z of world.zombies) {
            if (z.row === p.row && z.state !== "dying" && z.x > p.cx - 8 && z.x < reach) {
              has = true;
              break;
            }
          }
          if (has && p.fireT <= 0 && t > 0) {
            if (p.type === "qiuqiu") {
              p.fireT = 0.4;
              p.recoil = 1;
              p.flash = 0.1;
              const py = p.fy - 44;
              const isMissile = world.rng() < 0.15;
              const type = isMissile ? "missile" : "bullet";
              const dmg = isMissile ? 90 : 25;
              const vx = isMissile ? 300 : 520;
              world.peas.push({ x: p.cx + 52, y: py, row: p.row, type, dmg, vx, prevX: p.cx + 52 });
              if (isMissile) world.ports.sound("missile");
              else world.ports.sound("gatling");
            } else if (p.type === "puff") {
              p.fireT = 1.5;
              p.recoil = 1;
              p.flash = 0.09;
              const py = p.fy - 28;
              world.peas.push({ x: p.cx + 14, y: py, row: p.row, type: "spore", dmg: 20, vx: 300, prevX: p.cx + 14 });
              world.ports.sound("shoot");
            } else {
              p.fireT = 1.4;
              p.recoil = 1;
              p.flash = 0.09;
              const py = p.fy - 52;
              const kind = p.type === "snowpea" ? "snow" : "pea";
              world.peas.push({ x: p.cx + 30, y: py, row: p.row, type: kind, dmg: 20, vx: 340, prevX: p.cx + 30 });
              if (p.type === "repeater") {
                world.peas.push({ x: p.cx + 12, y: py + 6, row: p.row, type: kind, dmg: 20, vx: 340, prevX: p.cx + 12 });
              }
              if (kind === "snow") world.ports.sound("snowShoot");
              else world.ports.sound("shoot");
            }
          }
          break;
        }
        case "potato":
          if (!p.armed) {
            p.armT += dt;
            if (p.armT >= 14) {
              p.armed = true;
              addDirtPuff(world, p.cx, p.fy);
            }
          } else {
            for (const z of world.zombies) {
              if (z.row === p.row && z.state !== "dying" && Math.abs(z.x - p.cx) < 34) {
                removePlant(world, p);
                explode(world, p.cx, p.row, false);
                break;
              }
            }
          }
          break;
        case "cherry":
          p.fuse -= dt;
          if (p.fuse <= 0) {
            removePlant(world, p);
            explode(world, p.cx, p.row, true);
          }
          break;
        case "tiga": {
          if (t > 0) {
            p.lifeT -= dt;
            if (p.lifeT <= 0) {
              removePlant(world, p);
              for (let k = 0; k < 12; k++) {
                v.parts.push({
                  x: p.cx + rand(world.fxRng, -16, 16),
                  y: p.fy - rand(world.fxRng, 6, 84),
                  vx: rand(world.fxRng, -28, 28),
                  vy: rand(world.fxRng, -200, -90),
                  g: -30,
                  life: rand(world.fxRng, 0.35, 0.7),
                  max: 0.7,
                  size: rand(world.fxRng, 2, 5),
                  color: "#9fe4ff"
                });
              }
              world.ports.sound("hop");
              break;
            }
          }
          p.fireT -= dt;
          let has = false;
          for (const z of world.zombies) {
            if (z.row === p.row && z.state !== "dying" && z.x > p.cx - 8 && z.x < W + 50) {
              has = true;
              break;
            }
          }
          if (has && p.fireT <= 0 && t > 0) {
            p.fireT = 6.5;
            p.recoil = 1;
            p.flash = 0.4;
            world.peas.push({ x: p.cx - 30, y: p.fy - 58, row: p.row, type: "beam", dmg: 400, vx: 720, prevX: p.cx - 30 });
            v.shake = Math.max(v.shake, 0.22);
            world.ports.sound("missile");
          }
          break;
        }
      }
    }
  }
  function stepProjectiles(world, dt) {
    const v = world.visual;
    for (let i = world.peas.length - 1; i >= 0; i--) {
      const pea = world.peas[i];
      pea.prevX = pea.x;
      pea.x += pea.vx * dt;
      if (pea.type === "fire" && world.fxRng() < 0.6) {
        v.parts.push({ x: pea.x - 8, y: pea.y + rand(world.fxRng, -3, 3), vx: rand(world.fxRng, -30, -10), vy: rand(world.fxRng, -25, 5), g: -60, life: rand(world.fxRng, 0.15, 0.3), max: 0.3, size: rand(world.fxRng, 2, 4), color: "#ffb347" });
      }
      if (pea.type === "pea" || pea.type === "snow") {
        for (const p of world.plants) {
          if (p.type === "torch" && p.row === pea.row && pea.prevX < p.cx && pea.x >= p.cx) {
            pea.type = "fire";
            pea.dmg *= 2;
            addFlamePuff(world, p.cx, pea.y);
          }
        }
      }
      let hit = false;
      const beam = pea.type === "beam";
      for (const z of world.zombies) {
        if (z.row !== pea.row || z.state === "dying") continue;
        if (beam) {
          const front = z.x - 24;
          if (pea.prevX < front && pea.x >= front) {
            damageZombie(world, z, pea.dmg);
            addPeaSplat(world, pea.x, pea.y, "beam");
          }
          continue;
        }
        if (!(pea.x >= z.x - 24 && pea.x <= z.x + 16)) continue;
        if (pea.type === "missile") {
          explodeMissile(world, pea.x, pea.row, Math.floor((pea.x - LX) / CW));
          hit = true;
          break;
        }
        damageZombie(world, z, pea.dmg);
        if (pea.type === "snow") {
          z.slowT = 6;
        }
        if (pea.type === "fire") {
          for (const z2 of world.zombies) {
            if (z2 !== z && z2.row === pea.row && z2.state !== "dying" && Math.abs(z2.x - z.x) < 45) {
              damageZombie(world, z2, 20);
            }
          }
        }
        addPeaSplat(world, pea.x, pea.y, pea.type);
        if (pea.type === "bullet") world.ports.sound("bulletHit");
        else world.ports.sound("splat");
        hit = true;
        break;
      }
      if (hit || pea.x > W + 60) world.peas.splice(i, 1);
    }
  }
  function stepZombies(world, dt) {
    const t = world.t;
    const v = world.visual;
    let lost = false;
    for (let i = world.zombies.length - 1; i >= 0; i--) {
      const z = world.zombies[i];
      if (z.state === "dying") {
        z.deathT += dt;
        if (z.deathT > 0.95) world.zombies.splice(i, 1);
        continue;
      }
      if (z.slowT > 0) z.slowT -= dt;
      const slowMul = z.slowT > 0 ? 0.45 : 1;
      if (t <= 0) continue;
      if (z.state === "walk") {
        const animMul = z.type === "vault" && !z.poleLost ? 1.7 : z.angry ? 2.1 : 1;
        z.animT += dt * slowMul * animMul;
        z.x -= z.speed * slowMul * dt;
        z.dustT = (z.dustT || 0) + dt;
        if (z.dustT > 0.5 && z.x > LX - 30 && z.x < W) {
          z.dustT = 0;
          v.parts.push({ x: z.x + rand(world.fxRng, -6, 10), y: LY + (z.row + 1) * CH - 6, vx: rand(world.fxRng, -14, 6), vy: rand(world.fxRng, -22, -8), g: 30, life: rand(world.fxRng, 0.3, 0.55), max: 0.55, size: rand(world.fxRng, 2, 4), color: "rgba(150,140,110,0.4)" });
        }
        if (z.type === "vault" && !z.poleLost) {
          let target = null;
          for (let c = COLS - 1; c >= 0; c--) {
            const p = world.grid[z.row][c];
            if (p && !(p.type === "potato" && !p.armed) && p.cx < z.x - 6 && p.cx > z.x - 150) {
              target = p;
              break;
            }
          }
          if (target) {
            z.state = "vault";
            z.vt = 0;
            z.fromX = z.x;
            z.toX = Math.max(target.cx - CW + 18, LX - 10);
            world.ports.sound("hop");
            continue;
          }
        }
        const food = findEatTarget(world, z);
        if (food) {
          z.state = "eat";
          z.eatT = 0;
          z.eatPlant = food;
          z.x = Math.max(z.x, food.cx + 40);
        }
      } else if (z.state === "vault") {
        z.vt += dt / 0.55;
        if (z.vt >= 1) {
          z.x = z.toX;
          z.state = "walk";
          z.poleLost = true;
          z.speed = ZTYPES.normal.speed * rand(world.rng, 0.92, 1.08);
          z.vy = 0;
          addDirtPuff(world, z.x, LY + (z.row + 1) * CH - 6);
        } else {
          z.x = lerp(z.fromX, z.toX, easeOut(z.vt));
          z.vy = -Math.sin(Math.PI * z.vt) * 72;
        }
      } else if (z.state === "eat") {
        z.eatT += dt;
        if (Math.floor(z.eatT / 0.62) !== Math.floor((z.eatT - dt) / 0.62)) world.ports.sound("chomp");
        const p = z.eatPlant;
        if (!p || p.hp <= 0 || world.grid[z.row][p.col] !== p) {
          z.state = "walk";
          z.eatPlant = null;
        } else {
          p.hp -= 100 * dt;
          if (p.hp <= 0) {
            addLeafBurst(world, p.cx, p.fy - 30);
            removePlant(world, p);
            z.state = "walk";
            z.eatPlant = null;
            world.ports.sound("chomp");
          }
        }
      }
      if (z.state !== "dying" && z.x < LX + 14) {
        const m = world.mowers.find((m2) => m2.row === z.row && m2.state === "idle");
        if (m) triggerMower(world, z.row);
        else if (z.x < LX - 72) {
          lost = true;
          world.loseZombie = z;
        }
      }
    }
    if (lost) {
      world.state = "lost";
      world.ports.sound("lose");
      return true;
    }
    return false;
  }
  function stepMowers(world, dt) {
    const v = world.visual;
    for (const m of world.mowers) {
      if (m.state === "run") {
        m.x += 330 * dt;
        if (world.fxRng() < 0.55) {
          v.parts.push({ x: m.x + rand(world.fxRng, 6, 26), y: LY + m.row * CH + CH - 8, vx: rand(world.fxRng, -60, 20), vy: rand(world.fxRng, -140, -60), g: 300, life: rand(world.fxRng, 0.25, 0.5), max: 0.5, size: rand(world.fxRng, 2, 4), color: "#7cc24a" });
        }
        for (const z of world.zombies) {
          if (z.row === m.row && z.state !== "dying" && z.x < m.x + 52 && z.x > m.x - 70) {
            damageZombie(world, z, 9999);
          }
        }
        if (m.x > W + 80) m.state = "gone";
      }
    }
  }
  function stepSuns(world, dt) {
    for (let i = world.suns.length - 1; i >= 0; i--) {
      const s = world.suns[i];
      s.t += dt;
      if (s.state === "fall") {
        s.y += (s.fromSky ? 130 : 105) * dt;
        s.x = s.sx + Math.sin(s.t * 2.4) * (s.fromSky ? 9 : 4);
        if (s.y >= s.ty) {
          s.y = s.ty;
          s.state = "idle";
          s.t = 0;
        }
      } else if (s.state === "idle") {
        s.life -= dt;
        if (s.life <= 0) {
          world.suns.splice(i, 1);
        }
      } else if (s.state === "fly") {
        s.ft += dt / 0.42;
        if (s.ft >= 1) {
          world.sun = Math.min(9990, world.sun + s.value);
          world.sunFlash = 0.35;
          world.ports.sound("sun");
          world.suns.splice(i, 1);
        }
      }
    }
    if (world.sunFlash > 0) world.sunFlash -= dt;
  }
  function stepVisual(world, dt) {
    const v = world.visual;
    for (let i = v.parts.length - 1; i >= 0; i--) {
      const p = v.parts[i];
      p.life -= dt;
      if (p.life <= 0) {
        v.parts.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.g) p.vy += p.g * dt;
    }
    for (let i = v.decals.length - 1; i >= 0; i--) {
      v.decals[i].ttl -= dt;
      if (v.decals[i].ttl <= 0) v.decals.splice(i, 1);
    }
    if (world.zombies.length > 0) {
      v.groanTimer -= dt;
      if (v.groanTimer <= 0) {
        v.groanTimer = rand(world.fxRng, 4, 9);
        world.ports.sound("groan");
      }
    }
    if (v.waveText) {
      v.waveText.t += dt;
      if (v.waveText.t > 2.6) v.waveText = null;
    }
  }
  function stepProgress(world, dt) {
    const v = world.visual;
    if (world.evIdx >= world.events.length && world.zombies.length === 0 && world.t > 0) {
      world.winT += dt;
      if (world.winT > 1) {
        world.state = "won";
        if (world.level + 2 > world.unlocked) {
          world.unlocked = clamp(world.level + 2, 1, LEVELS.length);
          world.ports.saveProgress(world.unlocked);
        }
        world.ports.sound("win");
      }
    }
    for (const s of world.slots) if (s.cool > 0) s.cool = Math.max(0, s.cool - dt);
    if (v.shake > 0) v.shake -= dt;
    if (v.flash > 0) v.flash = Math.max(0, v.flash - dt * 1.4);
  }

  // src/game.js
  function createGame({ world, ui, frameState: frameState2, audio, render: render2, now, requestFrame }) {
    function dispatch(action) {
      switch (action.type) {
        case "nav":
          world.state = action.state;
          audio.click();
          return;
        case "level":
          chooseLevel(world, ui, action.index);
          return;
        case "unlockAll":
          toggleUnlockAll(world);
          return;
        case "pickSlot":
          pickSlot(world, ui, action.index);
          return;
        case "shovel":
          toggleShovel(world, ui);
          return;
        case "slot":
          removeSlot(world, ui, action.index);
          return;
        case "plantPick":
          pickTeamPlant(world, ui, action.plant);
          return;
        case "startQuiz":
          if (world.slots.length) startQuiz(world);
          else audio.error();
          return;
        case "answer":
          answerQuiz(world, action.value);
          return;
        case "pause":
          togglePause(world);
          return;
        case "music":
          if (action.ensure) audio.ensure();
          audio.musicOn = !audio.musicOn;
          audio.click();
          return;
      }
    }
    function handlePress(p) {
      audio.ensure();
      audio.resume();
      ui.mouse = p;
      const h = hitHotspot(ui, p);
      if (h) {
        dispatch(h.action);
        return;
      }
      if (world.state !== "play" || world.paused) return;
      if (collectSun(world, p.x, p.y).ok) return;
      const c = Math.floor((p.x - LX) / CW), r = Math.floor((p.y - LY) / CH);
      if (c >= 0 && c < COLS && r >= 0 && r < ROWS) pressCell(world, ui, r, c);
    }
    function handleKey(key) {
      if (world.state === "play") {
        if (key >= "1" && key <= "8") {
          const i = parseInt(key) - 1;
          if (i < world.slots.length && !world.paused) pickSlot(world, ui, i);
        } else if (key === "Escape") {
          clearSelection(ui);
        } else if (key === "p" || key === "P") {
          togglePause(world);
        } else if (key === "m" || key === "M") {
          audio.musicOn = !audio.musicOn;
        }
      }
    }
    let last;
    function frame(timestamp) {
      try {
        let dt = (timestamp - last) / 1e3;
        last = timestamp;
        dt = Math.min(dt, 0.05);
        frameState2.t += dt;
        frameState2.musicOn = audio.musicOn;
        if (world.state === "play" && !world.paused) updatePlay(world, dt);
        else if (world.state === "quiz") updateQuiz(world, dt);
        render2(world, ui, frameState2);
      } finally {
        requestFrame(frame);
      }
    }
    function start() {
      last = now();
      requestFrame(frame);
    }
    return { dispatch, handlePress, handleKey, start };
  }

  // src/main.js
  var SEED = randomSeed();
  var ports = {
    sound: (name) => SFX[name](),
    saveProgress: (value) => saveUnlocked(value),
    saveUnlockAll: (on) => saveUnlockAll(on)
  };
  var G = createWorld({ seed: SEED, ports, unlocked: loadUnlocked(), unlockAll: loadUnlockAll() });
  var UI = createUI();
  var drawRng = mulberry32((SEED ^ DRAW_SEED_XOR) >>> 0);
  var cv = document.getElementById("game");
  bindCanvas(cv);
  var frameState = { t: 0, rng: drawRng, musicOn: SFX.musicOn };
  var game = createGame({
    world: G,
    ui: UI,
    frameState,
    audio: SFX,
    render,
    now: () => performance.now(),
    requestFrame: (cb) => requestAnimationFrame(cb)
  });
  bindInput({
    canvas: cv,
    document,
    window,
    world: G,
    ui: UI,
    onPress: game.handlePress,
    onKey: game.handleKey
  });
  game.start();
})();

</script>
</body>
